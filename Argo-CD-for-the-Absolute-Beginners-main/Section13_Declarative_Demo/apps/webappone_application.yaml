apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  labels:
    app: webappone
  name: webappone
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hazardsoft/ArgoCD.git
    path: ./Argo-CD-for-the-Absolute-Beginners-main/Section13_Declarative_Demo/apps/webappone
  destination:
    server: https://kubernetes.default.svc
    namespace: webappone-ns
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
